  say: "{them_jg} is weak early, but mid can't move first: invade only with vision; otherwise gank and take scuttle."
  tests:
    fires: {them.jg.early: 1, lanes.mid.state.diff: -1.0}
    not: {them.jg.early: 1, lanes.mid.state.diff: 0.5}

