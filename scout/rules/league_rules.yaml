# ================================================================= COUNTER-PICK (my matchup)
# One context per game: my champion vs my lane opponent (docs/COUNTERPICK.md). The verdict line
# itself (with the numbers) comes from scout/counterpick.py; these add how to play into it.
- id: COUNTER-HARD
  scope: counterpick
  section: counterpick
  priority: 80
  confidence: high
  when: [[outlook, ==, hard_counter], [label, in, [counter_picked, bad_draw]], [me.role, "!=", jungle]]
  say: "Winning lane isn't the goal against {opp}: options are giving up CS under tower when you have to, trading only while their key ability is down, and asking your jungler for early cover. Reaching your item spikes alive is the win."
  tests:
    fires: {outlook: hard_counter, label: bad_draw, me.role: top}
    not: {outlook: hard_counter, label: weak_patch, me.role: top}

- id: COUNTER-SOFT
  scope: counterpick
  section: counterpick
  priority: 70
  confidence: med
  when: [[outlook, ==, soft_counter], [label, in, [counter_picked, bad_draw]], [me.role, "!=", jungle]]
  say: "{opp} has a slight edge on {me}: play even, avoid their power windows, and look for your spike to turn it."
  tests:
    fires: {outlook: soft_counter, label: counter_picked, me.role: mid}
    not: {outlook: soft_counter, label: weak_patch, me.role: mid}

- id: JG-COUNTER-BAD
  scope: counterpick
  section: counterpick
  priority: 80
  confidence: med
  when: [[outlook, in, [soft_counter, hard_counter]], [label, in, [counter_picked, bad_draw]], [me.role, ==, jungle]]
  say: "{opp} has the better matchup overall. Options: stay away from their side early unless your lanes can move first, ward their entrances, and path toward your strongest lanes."
  tests:
    fires: {outlook: hard_counter, label: bad_draw, me.role: jungle}
    not: {outlook: hard_counter, label: weak_patch, me.role: jungle}

- id: COUNTER-PICKED-AFTER
  scope: counterpick
  section: counterpick
  priority: 85
  confidence: high
  when: [[label, ==, counter_picked]]
  say: "They locked {opp} after seeing {me}, so expect them to play aggressively early; respect it."
  tests:
    fires: {label: counter_picked}
    not: {label: bad_draw}

- id: COUNTER-WEAK-PATCH
  scope: counterpick
  section: counterpick
  priority: 65
  confidence: med
  when: [[label, ==, weak_patch]]
  say: "Play your normal game against {opp}, a bit safer: the matchup itself isn't the problem."
  tests:
    fires: {label: weak_patch}
    not: {label: counter_picked}

- id: YOU-COUNTERED
  scope: counterpick
  section: counterpick
  priority: 75
  confidence: high
  when: [[label, ==, you_countered], [me.role, "!=", jungle]]
  say: "You have the matchup. Options: press it early, take priority, deny CS, and make plays before their spikes."
  tests:
    fires: {label: you_countered, me.role: top}
    not: {label: favorable, me.role: top}

- id: JG-YOU-COUNTERED
  scope: counterpick
  section: counterpick
  priority: 75
  confidence: med
  when: [[outlook, ==, favorable], [me.role, ==, jungle]]
  say: "You win early jungle fights against {opp}. Options: track their start and contest their camps or scuttles when your lanes can move first."
  tests:
    fires: {outlook: favorable, me.role: jungle}
    not: {outlook: even, me.role: jungle}

- id: COUNTER-WE-SCALE
  scope: counterpick
  section: counterpick
  priority: 78
  confidence: high
  when: [[outlook, in, [soft_counter, hard_counter]], [me.scaling, ">", 2], [me.role, "!=", jungle]]
  say: "You out-scale {opp}: losing lane slightly is fine; dying isn't."
  tests:
    fires: {outlook: hard_counter, me.scaling: 3, me.role: mid}
    not: {outlook: hard_counter, me.scaling: 3, me.role: jungle}

