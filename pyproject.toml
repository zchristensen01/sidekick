[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sidekick"
version = "0.0.1"
description = "Pre-game League of Legends scouting report for whichever role you're playing (personal use)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",            # CLI
    "httpx>=0.27,<1",         # HTTP: League client (LCU) and data sources
    "websockets>=13",         # LCU event subscription
    "psutil>=6",              # find the League client process (docs/LCU.md)
    "pyyaml>=6",              # config, rules, fixtures
    "python-dotenv>=1.0",     # .env secrets
    "anthropic>=1.0,<2",      # report writer, draft-traits
    "pywebview>=6; sys_platform == 'win32'",  # the app window (Edge engine on Windows)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.20"]  # packaging/build.py: the installed app

[project.scripts]
scout = "scout.cli:app"

[project.gui-scripts]
sidekick = "scout.app.main:main"  # .venv/Scripts/sidekick.exe: the app, no console window

[tool.setuptools.packages.find]
include = ["scout*"]

[tool.setuptools.package-data]
scout = ["rules/*.yaml", "lcu/*.pem", "app/*.html", "app/*.ico", "app/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["prototype", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scout/research.py" = ["E501"]  # prompt templates hold markdown tables
